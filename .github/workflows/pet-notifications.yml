name: Process MyPuppy notifications

on:
  schedule:
    # GitHub Actions schedules use UTC. This runs every hour.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  process-pets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process background pet events
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --location \
            --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://mypuppy-pied.vercel.app/api/cron/pets"
